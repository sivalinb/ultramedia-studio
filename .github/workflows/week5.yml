name: Week 5 reproducibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'backend[dev]'
      - run: python -m pytest backend/tests --junitxml=week5-tests.xml
      - run: PYTHONPATH=backend/src python week5/scripts/check_submission.py
      - uses: actions/upload-artifact@v4
        with:
          name: week5-python-evidence
          path: week5-tests.xml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run build
