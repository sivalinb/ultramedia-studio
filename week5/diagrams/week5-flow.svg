<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">UltraMedia Week 5: data to trained model to editor</title><desc id="desc">Training uses 400 examples, validation 80, and frozen test 120. QLoRA trains adapters, which are merged for local serving. Base and adapted models are compared. At inference supplied race facts lead to a draft or an evidence hold, then human editorial review. Human review and final GPU control remain pending.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65dce1"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#eaf2fc}.muted{fill:#a5b6cd}.cyan{fill:#65dce1}.amber{fill:#f5c578}.small{font-size:19px}.body{font-size:22px}.label{font-size:18px;font-weight:700;letter-spacing:2px}</style></defs><rect width="1600" height="1120" rx="28" fill="#0a1426"/><path d="M50 130H1550" stroke="#2c405c"/><text x="54" y="60" class="label cyan">ULTRAMEDIA / WEEK 5 / FINE-TUNING IN CONTEXT</text><text x="54" y="110" font-size="38" font-weight="700">Teach the behavior. Supply the facts. Keep the editor.</text>
<text x="54" y="175" class="label cyan">01 / LEARNING THE TASK</text>
<text x="990" y="175" class="label cyan">EXECUTED • 100 TRAINING STEPS</text>
<rect x="54" y="204" width="280" height="213" rx="16" fill="#13233a" stroke="#35516d"/><rect x="54" y="204" width="280" height="5" rx="2" fill="#65dce1"/>
<text x="74" y="238" class="label cyan">A</text>
<text x="74" y="274" class="body">Labeled examples</text>
<text x="74" y="312" class="small muted">600 fictional examples</text>
<text x="74" y="341" class="small muted">Facts + cited target</text>
<text x="74" y="370" class="small muted">Draft or evidence hold</text>
<path d="M336 307 L352 307" stroke="#65dce1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="356" y="204" width="280" height="213" rx="16" fill="#13233a" stroke="#35516d"/><rect x="356" y="204" width="280" height="5" rx="2" fill="#65dce1"/>
<text x="376" y="238" class="label cyan">B</text>
<text x="376" y="274" class="body">Separate race groups</text>
<text x="376" y="312" class="small muted">Train 400 / validate 80</text>
<text x="376" y="341" class="small muted">Frozen test 120</text>
<text x="376" y="370" class="small muted">No shared race groups</text>
<path d="M638 307 L654 307" stroke="#65dce1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="658" y="204" width="280" height="213" rx="16" fill="#13233a" stroke="#35516d"/><rect x="658" y="204" width="280" height="5" rx="2" fill="#65dce1"/>
<text x="678" y="238" class="label cyan">C</text>
<text x="678" y="274" class="body">QLoRA training</text>
<text x="678" y="312" class="small muted">Qwen3 4B • NF4 base</text>
<text x="678" y="341" class="small muted">Rank 16 / 2 epochs</text>
<text x="678" y="370" class="small muted">Completion-only loss</text>
<path d="M940 307 L956 307" stroke="#65dce1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="960" y="204" width="280" height="213" rx="16" fill="#13233a" stroke="#35516d"/><rect x="960" y="204" width="280" height="5" rx="2" fill="#65dce1"/>
<text x="980" y="238" class="label cyan">D</text>
<text x="980" y="274" class="body">Select + merge</text>
<text x="980" y="312" class="small muted">Best validation: step 100</text>
<text x="980" y="341" class="small muted">Adapter hashes verified</text>
<text x="980" y="370" class="small muted">Merged to local GGUF</text>
<path d="M1242 307 L1258 307" stroke="#65dce1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="1262" y="204" width="280" height="213" rx="16" fill="#13233a" stroke="#35516d"/><rect x="1262" y="204" width="280" height="5" rx="2" fill="#65dce1"/>
<text x="1282" y="238" class="label cyan">E</text>
<text x="1282" y="274" class="body">Compare fairly</text>
<text x="1282" y="312" class="small muted">Same base + inputs</text>
<text x="1282" y="341" class="small muted">Same local constraints</text>
<text x="1282" y="370" class="small muted">Keep every failure</text>
<rect x="54" y="448" width="1488" height="147" rx="16" fill="#102c39" stroke="#2a6370"/>
<text x="78" y="482" class="label cyan">MEASURED LOCAL RESULTS / 120 SYNTHETIC CASES PER MODEL</text>
<text x="78" y="531" font-size="36" font-weight="700">83.3% → 90.8%</text>
<text x="78" y="567" class="small muted">Draft / hold accuracy</text>
<text x="515" y="531" font-size="36" font-weight="700">63.3% → 90.8%</text>
<text x="515" y="567" class="small muted">All nine checks passed</text>
<text x="1010" y="531" font-size="36" font-weight="700">18 → 11</text>
<text x="1010" y="567" class="small muted">Unnecessary holds</text>
<text x="54" y="644" class="label cyan">02 / USING THE MODEL</text>
<text x="958" y="644" class="label cyan">ACTUAL LOCAL SERVING VERIFIED</text>
<rect x="54" y="676" width="280" height="185" rx="16" fill="#13233a" stroke="#35516d"/><rect x="54" y="676" width="280" height="5" rx="2" fill="#65dce1"/>
<text x="74" y="710" class="label cyan">INPUT</text>
<text x="74" y="746" class="body">Race evidence</text>
<text x="74" y="784" class="small muted">Timing + citations</text>
<text x="74" y="813" class="small muted">Requested signal</text>
<text x="74" y="842" class="small muted">Hints are untrusted</text>
<rect x="399" y="676" width="280" height="185" rx="16" fill="#13233a" stroke="#35516d"/><rect x="399" y="676" width="280" height="5" rx="2" fill="#65dce1"/>
<text x="419" y="710" class="label cyan">MODEL</text>
<text x="419" y="746" class="body">Draft or hold</text>
<text x="419" y="784" class="small muted">Structured response</text>
<text x="419" y="813" class="small muted">Claims cite evidence</text>
<text x="419" y="842" class="small muted">No automatic publish</text>
<rect x="744" y="676" width="280" height="185" rx="16" fill="#13233a" stroke="#35516d"/><rect x="744" y="676" width="280" height="5" rx="2" fill="#65dce1"/>
<text x="764" y="710" class="label cyan">CHECK</text>
<text x="764" y="746" class="body">Validate the output</text>
<text x="764" y="784" class="small muted">Facts + numeric checks</text>
<text x="764" y="813" class="small muted">Invalid output rejected</text>
<text x="764" y="842" class="small muted">Meaning needs review</text>
<rect x="1089" y="676" width="453" height="185" rx="16" fill="#13233a" stroke="#35516d"/><rect x="1089" y="676" width="453" height="5" rx="2" fill="#f5c578"/>
<text x="1109" y="710" class="label cyan">EDITOR</text>
<text x="1109" y="746" class="body">Human decision</text>
<text x="1109" y="784" class="small muted">Inspect sources and correct wording</text>
<text x="1109" y="813" class="small muted">Approve a version or ask for evidence</text>
<text x="1109" y="842" class="small muted">Training consent is a separate choice</text>
<path d="M338 765 L393 765" stroke="#65dce1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M683 765 L738 765" stroke="#65dce1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M1028 765 L1083 765" stroke="#65dce1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="54" y="902" width="1488" height="164" rx="16" fill="#30283a" stroke="#775c56"/>
<text x="78" y="939" class="label amber">WHAT THE EVIDENCE DOES NOT PROVE</text>
<text x="78" y="977" class="body">Rules also pass 120/120 engineered cases. Editorial usefulness beyond rules is not yet established.</text>
<text x="78" y="1012" class="body">Final explicit-schema GPU control and independent human review are pending.</text>
<text x="78" y="1045" class="small muted">Training → evaluation → review is a research workflow; high automatic scores do not authorize production.</text>
</svg>