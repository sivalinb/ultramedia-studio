[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ultramedia-api"
version = "0.1.0"
description = "Python control plane for the UltraMedia Studio AI newsroom"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-exporter-otlp>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<8", "ruff>=0.8,<1"]
finetune = [
  "accelerate==1.10.1", "bitsandbytes==0.47.0", "datasets==4.1.1", "peft==0.17.1",
  "torch==2.8.0", "transformers==4.56.2", "trl==0.23.1", "jinja2==3.1.6",
]

[project.scripts]
ultramedia-api = "ultramedia.main:run"
ultramedia-eval = "ultramedia.evals:main"
ultramedia-ingest = "ultramedia.ingestion:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ultramedia"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
