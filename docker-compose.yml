services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ultramedia
      POSTGRES_USER: ultramedia
      POSTGRES_PASSWORD: ultramedia-local
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultramedia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ultramedia:ultramedia-local@postgres:5432/ultramedia
      PROVIDER_MODE: ${PROVIDER_MODE:-local}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ultramedia-production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:4317
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006", "4317:4317"]
    volumes: ["phoenix-data:/root/.phoenix"]

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-model"]
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]

volumes:
  postgres-data:
  phoenix-data:
  ollama-data:

